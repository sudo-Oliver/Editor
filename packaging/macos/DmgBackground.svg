<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!-- The dmg window is 960 by 480, wide enough for the smallest Finder
       window of recent macOS: the build keeps the middle band. -->
  <rect width="960" height="960" fill="#f6f5f1"/>
  <g transform="translate(0 240)">
    <text x="480" y="78" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#2b2b2b">Drag Editor onto Applications</text>
    <path d="M 398 200 L 548 200" stroke="#3a3a3a" stroke-width="4" fill="none"/>
    <path d="M 544 187 L 566 200 L 544 213 Z" fill="#3a3a3a"/>
    <text x="480" y="448" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b6b">macOS warns on the first open. First open.txt says what to click.</text>
  </g>
</svg>
