[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "LicenseRef-PolyForm-Strict-1.0.0"
version = "0.1.0"

[workspace.dependencies]
# GPUI is pre-1.0, so it stays pinned to the exact commit of Zed tag v1.26.2.
gpui = { git = "https://github.com/zed-industries/zed", rev = "5709f329dc0d85b0e369d2973acb5efce6b8dea8" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5709f329dc0d85b0e369d2973acb5efce6b8dea8", features = ["font-kit", "wayland", "x11"] }

# Slower to link, but this is what users run.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
