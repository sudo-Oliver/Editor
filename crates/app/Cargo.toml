[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
addon_api = { path = "../addon_api" }
collab = { path = "../collab", optional = true }
build = { path = "../build" }
editor_core = { path = "../editor_core" }
git = { path = "../git" }
pdf = { path = "../pdf" }
synctex = { path = "../synctex" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
gpui.workspace = true
gpui_platform.workspace = true
ignore = "0.4"
encoding_rs = "0.8"
flate2 = "1"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
toml = "1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
trash = "5.3.0"

[features]
default = ["collab"]
# Live editing with others, without a server. Nothing of it runs until a
# session opens.
collab = ["dep:collab"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time"] }
