[package]
name = "collab"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
data-encoding = "2"
editor_core = { path = "../editor_core" }
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
yrs = { version = "0.28", features = ["sync"] }
