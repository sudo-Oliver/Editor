name: Windows preview

# Builds the Windows installer for testing on a PC before a release: by
# hand, or for a pull request with the label windows-preview. The installer
# is an artifact of the run, not a release.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

# A new push to a pull request cancels the run of the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'windows-preview')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch PDFium
        shell: bash
        run: scripts/fetch-pdfium.sh
      - name: Build
        run: cargo build --release -p app
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)-preview"
          mkdir -p target/windows
          cp target/release/editor.exe target/windows/
          cp vendor/pdfium/bin/pdfium.dll target/windows/
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "-DVersion=$version" "-DSource=$(cygpath -w "$PWD/target/windows")" packaging/windows/editor.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Editor-windows-setup
          path: target/Editor-*-windows-x64-setup.exe
