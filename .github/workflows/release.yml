name: Release

# A tag like v0.2.0 builds the dmg and attaches it to a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # The Developer ID certificate lives only in the repository secrets, as a
      # base64 .p12, and in a keychain that the runner throws away.
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # Without a certificate the app is signed ad hoc, and the dmg's
          # "First open.txt" explains the warning macOS shows then.
          if [ -z "$CERTIFICATE" ]; then
            echo "No signing certificate in the secrets: the app gets an ad hoc signature."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign and notarize
        env:
          EDITOR_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/bundle-macos.sh

      - name: Fill in the Homebrew cask
        run: |
          dmg="$(ls target/bundle/*.dmg)"
          version="${GITHUB_REF_NAME#v}"
          checksum="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$checksum/" packaging/homebrew/editor.rb > target/bundle/editor.rb

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/bundle/*.dmg target/bundle/editor.rb --draft --title "$GITHUB_REF_NAME" --generate-notes

  # The Windows installer, attached to the draft release the dmg job made.
  windows:
    needs: dmg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch PDFium
        shell: bash
        run: scripts/fetch-pdfium.sh
      - name: Build
        run: cargo build --release -p app
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target/windows
          cp target/release/editor.exe target/windows/
          cp vendor/pdfium/bin/pdfium.dll target/windows/
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "-DVersion=$version" "-DSource=$(cygpath -w "$PWD/target/windows")" packaging/windows/editor.iss
          cd target
          sha256sum "Editor-$version-windows-x64-setup.exe" | cut -d' ' -f1 > "Editor-$version-windows-x64-setup.exe.sha256"
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" target/Editor-*-windows-x64-setup.exe target/Editor-*-windows-x64-setup.exe.sha256
