name: Release

# A tag like v0.2.0 builds the dmg and attaches it to a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # The Developer ID certificate lives only in the repository secrets, as a
      # base64 .p12, and in a keychain that the runner throws away.
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign and notarize
        env:
          EDITOR_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/bundle-macos.sh

      - name: Fill in the Homebrew cask
        run: |
          dmg="$(ls target/bundle/*.dmg)"
          version="${GITHUB_REF_NAME#v}"
          checksum="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$checksum/" packaging/homebrew/editor.rb > target/bundle/editor.rb

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/bundle/*.dmg target/bundle/editor.rb --draft --title "$GITHUB_REF_NAME" --generate-notes
